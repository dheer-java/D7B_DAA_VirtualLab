<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Algorithms Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --accent4: #f7971e;
    --accent5: #00c6ff;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --bar-default: #2a2a4a;
    --bar-comparing: #f7971e;
    --bar-swapping: #ff6584;
    --bar-sorted: #43e97b;
    --bar-pivot: #6c63ff;
    --bar-min: #00c6ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

  /* Header */
  header {
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .header-inner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    background: rgba(108,99,255,0.1);
    border: 1px solid rgba(108,99,255,0.3);
    padding: 4px 10px;
    border-radius: 4px;
  }
  h1 {
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  h1 span { color: var(--accent); }

  /* Algorithm tabs */
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .tab-btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .tab-btn:hover { border-color: var(--accent); color: var(--text); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  /* Main layout */
  .main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
  @media (max-width: 800px) { .main-grid { grid-template-columns: 1fr; } }

  /* Visualizer panel */
  .viz-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .viz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .algo-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
  }
  .algo-title span {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--accent);
    margin-left: 10px;
    background: rgba(108,99,255,0.1);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* Bar chart */
  .bar-container {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 220px;
    background: var(--surface);
    border-radius: 8px;
    padding: 12px 12px 0;
    border: 1px solid var(--border);
    margin-bottom: 20px;
    overflow: hidden;
  }

  .bar {
    flex: 1;
    border-radius: 4px 4px 0 0;
    transition: height 0.08s ease, background-color 0.1s;
    position: relative;
    min-width: 6px;
  }

  .bar-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    color: rgba(255,255,255,0.5);
    text-align: center;
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #8179ff; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: rgba(255,101,132,0.1); color: var(--accent2); border: 1px solid rgba(255,101,132,0.3); }
  .btn-danger:hover { background: rgba(255,101,132,0.2); }

  /* Speed & size sliders */
  .slider-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .slider-group { flex: 1; min-width: 140px; }
  .slider-group label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Stats */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 16px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-lbl {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* Info panel */
  .info-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .info-card h3 {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    font-family: 'Space Mono', monospace;
  }

  .complexity-table { width: 100%; border-collapse: collapse; }
  .complexity-table td {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .complexity-table td:first-child { color: var(--muted); font-size: 10px; }
  .complexity-table td.good { color: var(--accent3); }
  .complexity-table td.bad { color: var(--accent2); }
  .complexity-table td.ok { color: var(--accent4); }

  .desc-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }

  .pseudo-code {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    line-height: 1.8;
    color: #b8b8d0;
    white-space: pre;
    overflow-x: auto;
  }
  .pseudo-code .kw { color: var(--accent); }
  .pseudo-code .fn { color: var(--accent3); }
  .pseudo-code .cm { color: var(--muted); font-style: italic; }

  /* Status bar */
  .status-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent3);
    min-height: 34px;
    display: flex;
    align-items: center;
  }

  .tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 4px;
    margin: 3px 3px 3px 0;
    letter-spacing: 0.5px;
  }
  .tag-stable { background: rgba(67,233,123,0.1); color: var(--accent3); border: 1px solid rgba(67,233,123,0.2); }
  .tag-unstable { background: rgba(255,101,132,0.1); color: var(--accent2); border: 1px solid rgba(255,101,132,0.2); }
  .tag-inplace { background: rgba(0,198,255,0.1); color: var(--accent5); border: 1px solid rgba(0,198,255,0.2); }
  .tag-notinplace { background: rgba(247,151,30,0.1); color: var(--accent4); border: 1px solid rgba(247,151,30,0.2); }

  /* Footer */
  footer {
    margin-top: 40px;
    padding: 20px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* Merge sort tree visualization */
  .merge-tree { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-inner">
      <span class="logo">Virtual Lab</span>
      <h1>Sorting <span>Visualizer</span></h1>
    </div>
  </header>

  <div class="tabs" id="algTabs">
    <button class="tab-btn active" data-algo="selection">Selection Sort</button>
    <button class="tab-btn" data-algo="bubble">Bubble Sort</button>
    <button class="tab-btn" data-algo="merge">Merge Sort</button>
    <button class="tab-btn" data-algo="heap">Heap Sort</button>
    <button class="tab-btn" data-algo="quick">Quick Sort</button>
  </div>

  <div class="main-grid">
    <!-- Left: Visualizer -->
    <div class="viz-panel">
      <div class="viz-header">
        <div class="algo-title" id="algoTitle">Selection Sort <span>O(n²)</span></div>
      </div>

      <div class="status-bar" id="statusBar">Press "Sort" to begin visualization...</div>

      <div class="bar-container" id="barContainer"></div>

      <div class="slider-row">
        <div class="slider-group">
          <label>Array Size: <span id="sizeVal">20</span></label>
          <input type="range" id="sizeSlider" min="5" max="60" value="20">
        </div>
        <div class="slider-group">
          <label>Speed: <span id="speedVal">Medium</span></label>
          <input type="range" id="speedSlider" min="1" max="5" value="3">
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="btnSort">▶ Sort</button>
        <button class="btn btn-secondary" id="btnGenerate">⟳ New Array</button>
        <button class="btn btn-danger" id="btnStop">■ Stop</button>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--bar-default)"></div>Unsorted</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--bar-comparing)"></div>Comparing</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--bar-swapping)"></div>Swapping</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--bar-sorted)"></div>Sorted</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--bar-pivot)"></div>Pivot/Min</div>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="stat-val" id="statComp">0</div><div class="stat-lbl">Comparisons</div></div>
        <div class="stat-card"><div class="stat-val" id="statSwap">0</div><div class="stat-lbl">Swaps</div></div>
        <div class="stat-card"><div class="stat-val" id="statTime">0ms</div><div class="stat-lbl">Time</div></div>
      </div>
    </div>

    <!-- Right: Info -->
    <div class="info-panel" id="infoPanel">
      <!-- Dynamically filled -->
    </div>
  </div>

  <footer>Virtual Lab · Sorting Algorithms · Data Structures</footer>
</div>

<script>
// ====== STATE ======
let array = [];
let sorting = false;
let stopFlag = false;
let comparisons = 0;
let swaps = 0;
let startTime = 0;
let currentAlgo = 'selection';

const SPEED_MAP = { 1: 300, 2: 150, 3: 60, 4: 20, 5: 5 };
const SPEED_LABELS = { 1: 'Slow', 2: 'Medium-Slow', 3: 'Medium', 4: 'Fast', 5: 'Max' };

// ====== ALGO INFO ======
const ALGO_INFO = {
  selection: {
    name: 'Selection Sort',
    badge: 'O(n²)',
    desc: 'Selection Sort repeatedly finds the minimum element from the unsorted portion and places it at the beginning. Simple but inefficient for large arrays.',
    time_best: 'O(n²)', time_avg: 'O(n²)', time_worst: 'O(n²)',
    space: 'O(1)',
    stable: false, inplace: true,
    pseudo: `<span class="fn">selectionSort</span>(arr):
  n = arr.length
  <span class="kw">for</span> i = 0 to n-2:
    minIdx = i
    <span class="kw">for</span> j = i+1 to n-1:
      <span class="cm">// Find minimum</span>
      <span class="kw">if</span> arr[j] < arr[minIdx]:
        minIdx = j
    <span class="cm">// Swap min to position i</span>
    swap(arr[i], arr[minIdx])`
  },
  bubble: {
    name: 'Bubble Sort',
    badge: 'O(n²)',
    desc: 'Bubble Sort repeatedly steps through the list comparing adjacent elements and swapping them if needed. Larger elements "bubble up" to the end each pass.',
    time_best: 'O(n)', time_avg: 'O(n²)', time_worst: 'O(n²)',
    space: 'O(1)',
    stable: true, inplace: true,
    pseudo: `<span class="fn">bubbleSort</span>(arr):
  n = arr.length
  <span class="kw">for</span> i = 0 to n-1:
    swapped = <span class="kw">false</span>
    <span class="kw">for</span> j = 0 to n-i-2:
      <span class="kw">if</span> arr[j] > arr[j+1]:
        swap(arr[j], arr[j+1])
        swapped = <span class="kw">true</span>
    <span class="kw">if</span> !swapped: <span class="kw">break</span>`
  },
  merge: {
    name: 'Merge Sort',
    badge: 'O(n log n)',
    desc: 'Merge Sort uses divide-and-conquer: splits the array in half recursively until single elements, then merges sorted halves back together.',
    time_best: 'O(n log n)', time_avg: 'O(n log n)', time_worst: 'O(n log n)',
    space: 'O(n)',
    stable: true, inplace: false,
    pseudo: `<span class="fn">mergeSort</span>(arr, l, r):
  <span class="kw">if</span> l >= r: <span class="kw">return</span>
  mid = (l + r) / 2
  mergeSort(arr, l, mid)
  mergeSort(arr, mid+1, r)
  merge(arr, l, mid, r)

<span class="fn">merge</span>(arr, l, mid, r):
  <span class="cm">// Combine two sorted halves</span>
  left = arr[l..mid]
  right = arr[mid+1..r]
  <span class="kw">while</span> both have elements:
    pick smaller → arr`
  },
  heap: {
    name: 'Heap Sort',
    badge: 'O(n log n)',
    desc: 'Heap Sort builds a max-heap from the array, then repeatedly extracts the maximum element, placing it at the end to build a sorted array.',
    time_best: 'O(n log n)', time_avg: 'O(n log n)', time_worst: 'O(n log n)',
    space: 'O(1)',
    stable: false, inplace: true,
    pseudo: `<span class="fn">heapSort</span>(arr):
  n = arr.length
  <span class="cm">// Build max-heap</span>
  <span class="kw">for</span> i = n/2-1 downto 0:
    heapify(arr, n, i)
  <span class="cm">// Extract elements</span>
  <span class="kw">for</span> i = n-1 downto 1:
    swap(arr[0], arr[i])
    heapify(arr, i, 0)

<span class="fn">heapify</span>(arr, n, i):
  largest = i
  left = 2i+1, right = 2i+2
  <span class="kw">if</span> child > arr[largest]: update
  <span class="kw">if</span> largest ≠ i: swap & recurse`
  },
  quick: {
    name: 'Quick Sort',
    badge: 'O(n log n) avg',
    desc: 'Quick Sort picks a pivot, partitions the array so elements less than pivot are left and greater are right, then recursively sorts partitions.',
    time_best: 'O(n log n)', time_avg: 'O(n log n)', time_worst: 'O(n²)',
    space: 'O(log n)',
    stable: false, inplace: true,
    pseudo: `<span class="fn">quickSort</span>(arr, low, high):
  <span class="kw">if</span> low < high:
    p = partition(arr, low, high)
    quickSort(arr, low, p-1)
    quickSort(arr, p+1, high)

<span class="fn">partition</span>(arr, low, high):
  pivot = arr[high]
  i = low - 1
  <span class="kw">for</span> j = low to high-1:
    <span class="kw">if</span> arr[j] <= pivot:
      i++
      swap(arr[i], arr[j])
  swap(arr[i+1], arr[high])
  <span class="kw">return</span> i + 1`
  }
};

// ====== DOM ======
const barContainer = document.getElementById('barContainer');
const statusBar = document.getElementById('statusBar');
const statComp = document.getElementById('statComp');
const statSwap = document.getElementById('statSwap');
const statTime = document.getElementById('statTime');
const sizeSlider = document.getElementById('sizeSlider');
const speedSlider = document.getElementById('speedSlider');
const sizeVal = document.getElementById('sizeVal');
const speedVal = document.getElementById('speedVal');
const infoPanel = document.getElementById('infoPanel');
const algoTitle = document.getElementById('algoTitle');

// ====== INIT ======
function generateArray() {
  const size = parseInt(sizeSlider.value);
  array = Array.from({ length: size }, () => Math.floor(Math.random() * 90) + 10);
  comparisons = 0; swaps = 0;
  statComp.textContent = '0';
  statSwap.textContent = '0';
  statTime.textContent = '0ms';
  renderBars(array, []);
  statusBar.textContent = 'New array generated. Press "Sort" to begin...';
}

function renderBars(arr, colors = {}) {
  barContainer.innerHTML = '';
  const max = Math.max(...arr);
  arr.forEach((val, i) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const pct = (val / max) * 100;
    bar.style.height = `${pct}%`;
    bar.style.background = colors[i] || 'var(--bar-default)';
    if (arr.length <= 30) {
      const lbl = document.createElement('div');
      lbl.className = 'bar-label';
      lbl.textContent = val;
      bar.appendChild(lbl);
    }
    barContainer.appendChild(bar);
  });
}

// ====== DELAY ======
function delay(ms) {
  return new Promise(res => setTimeout(res, ms));
}

function getDelay() {
  return SPEED_MAP[parseInt(speedSlider.value)];
}

// ====== UPDATE STATS ======
function updateStats() {
  statComp.textContent = comparisons;
  statSwap.textContent = swaps;
  statTime.textContent = Math.round(performance.now() - startTime) + 'ms';
}

// ====== ALGORITHMS ======

// Selection Sort
async function selectionSort() {
  const arr = [...array];
  const n = arr.length;
  for (let i = 0; i < n - 1; i++) {
    if (stopFlag) break;
    let minIdx = i;
    for (let j = i + 1; j < n; j++) {
      if (stopFlag) break;
      comparisons++;
      const colors = {};
      for (let k = 0; k < i; k++) colors[k] = 'var(--bar-sorted)';
      colors[minIdx] = 'var(--bar-pivot)';
      colors[j] = 'var(--bar-comparing)';
      renderBars(arr, colors);
      statusBar.textContent = `Pass ${i+1}: Comparing index ${j} (${arr[j]}) with min (${arr[minIdx]})`;
      updateStats();
      await delay(getDelay());
      if (arr[j] < arr[minIdx]) minIdx = j;
    }
    if (minIdx !== i) {
      swaps++;
      [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
      const colors = {};
      for (let k = 0; k <= i; k++) colors[k] = 'var(--bar-swapping)';
      renderBars(arr, colors);
      await delay(getDelay() * 2);
    }
  }
  if (!stopFlag) {
    const colors = {};
    arr.forEach((_, i) => colors[i] = 'var(--bar-sorted)');
    renderBars(arr, colors);
    statusBar.textContent = `✓ Done! ${comparisons} comparisons, ${swaps} swaps`;
  }
  array = arr;
}

// Bubble Sort
async function bubbleSort() {
  const arr = [...array];
  const n = arr.length;
  let sortedCount = 0;
  for (let i = 0; i < n - 1; i++) {
    if (stopFlag) break;
    let swapped = false;
    for (let j = 0; j < n - i - 1; j++) {
      if (stopFlag) break;
      comparisons++;
      const colors = {};
      for (let k = n - sortedCount; k < n; k++) colors[k] = 'var(--bar-sorted)';
      colors[j] = 'var(--bar-comparing)';
      colors[j + 1] = 'var(--bar-comparing)';
      renderBars(arr, colors);
      statusBar.textContent = `Pass ${i+1}: Comparing ${arr[j]} and ${arr[j+1]}`;
      updateStats();
      await delay(getDelay());
      if (arr[j] > arr[j + 1]) {
        swaps++;
        swapped = true;
        [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
        const c2 = {};
        for (let k = n - sortedCount; k < n; k++) c2[k] = 'var(--bar-sorted)';
        c2[j] = 'var(--bar-swapping)';
        c2[j + 1] = 'var(--bar-swapping)';
        renderBars(arr, c2);
        await delay(getDelay());
      }
    }
    sortedCount++;
    if (!swapped) break;
  }
  if (!stopFlag) {
    const colors = {};
    arr.forEach((_, i) => colors[i] = 'var(--bar-sorted)');
    renderBars(arr, colors);
    statusBar.textContent = `✓ Done! ${comparisons} comparisons, ${swaps} swaps`;
  }
  array = arr;
}

// Merge Sort
async function mergeSort() {
  const arr = [...array];
  const sortedSet = new Set();

  async function merge(arr, l, mid, r) {
    const left = arr.slice(l, mid + 1);
    const right = arr.slice(mid + 1, r + 1);
    let i = 0, j = 0, k = l;
    while (i < left.length && j < right.length) {
      if (stopFlag) return;
      comparisons++;
      if (left[i] <= right[j]) { arr[k++] = left[i++]; }
      else { arr[k++] = right[j++]; swaps++; }
      const colors = {};
      for (let x = l; x <= r; x++) colors[x] = 'var(--bar-comparing)';
      for (let x of sortedSet) colors[x] = 'var(--bar-sorted)';
      arr.slice(l, k).forEach((_, idx) => colors[l + idx] = 'var(--bar-swapping)');
      renderBars(arr, colors);
      statusBar.textContent = `Merging range [${l}..${r}]`;
      updateStats();
      await delay(getDelay());
    }
    while (i < left.length) { arr[k++] = left[i++]; }
    while (j < right.length) { arr[k++] = right[j++]; }
  }

  async function ms(arr, l, r) {
    if (stopFlag || l >= r) return;
    const mid = Math.floor((l + r) / 2);
    await ms(arr, l, mid);
    await ms(arr, mid + 1, r);
    await merge(arr, l, mid, r);
    for (let x = l; x <= r; x++) sortedSet.add(x);
  }

  await ms(arr, 0, arr.length - 1);
  if (!stopFlag) {
    const colors = {};
    arr.forEach((_, i) => colors[i] = 'var(--bar-sorted)');
    renderBars(arr, colors);
    statusBar.textContent = `✓ Done! ${comparisons} comparisons, ${swaps} operations`;
  }
  array = arr;
}

// Heap Sort
async function heapSort() {
  const arr = [...array];
  const n = arr.length;

  async function heapify(arr, n, i, sortedFrom) {
    let largest = i;
    const l = 2 * i + 1;
    const r = 2 * i + 2;
    if (l < n) { comparisons++; if (arr[l] > arr[largest]) largest = l; }
    if (r < n) { comparisons++; if (arr[r] > arr[largest]) largest = r; }
    if (largest !== i) {
      swaps++;
      [arr[i], arr[largest]] = [arr[largest], arr[i]];
      const colors = {};
      for (let k = sortedFrom; k < arr.length; k++) colors[k] = 'var(--bar-sorted)';
      colors[i] = 'var(--bar-swapping)';
      colors[largest] = 'var(--bar-pivot)';
      renderBars(arr, colors);
      statusBar.textContent = `Heapify: swapping index ${i} and ${largest}`;
      updateStats();
      await delay(getDelay());
      await heapify(arr, n, largest, sortedFrom);
    }
  }

  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
    if (stopFlag) break;
    await heapify(arr, n, i, n);
  }

  for (let i = n - 1; i > 0; i--) {
    if (stopFlag) break;
    swaps++;
    [arr[0], arr[i]] = [arr[i], arr[0]];
    const colors = {};
    for (let k = i; k < n; k++) colors[k] = 'var(--bar-sorted)';
    colors[0] = 'var(--bar-swapping)';
    renderBars(arr, colors);
    statusBar.textContent = `Extracting max: placed ${arr[i]} at position ${i}`;
    updateStats();
    await delay(getDelay());
    await heapify(arr, i, 0, i);
  }

  if (!stopFlag) {
    const colors = {};
    arr.forEach((_, i) => colors[i] = 'var(--bar-sorted)');
    renderBars(arr, colors);
    statusBar.textContent = `✓ Done! ${comparisons} comparisons, ${swaps} swaps`;
  }
  array = arr;
}

// Quick Sort
async function quickSort() {
  const arr = [...array];
  const sortedSet = new Set();

  async function partition(arr, low, high) {
    const pivot = arr[high];
    let i = low - 1;
    for (let j = low; j < high; j++) {
      if (stopFlag) return i + 1;
      comparisons++;
      const colors = {};
      for (let x of sortedSet) colors[x] = 'var(--bar-sorted)';
      colors[high] = 'var(--bar-pivot)';
      colors[j] = 'var(--bar-comparing)';
      if (i >= 0) colors[i] = 'var(--bar-swapping)';
      renderBars(arr, colors);
      statusBar.textContent = `Pivot: ${pivot}, comparing index ${j} (${arr[j]})`;
      updateStats();
      await delay(getDelay());
      if (arr[j] <= pivot) {
        i++;
        swaps++;
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    swaps++;
    [arr[i + 1], arr[high]] = [arr[high], arr[i + 1]];
    return i + 1;
  }

  async function qs(arr, low, high) {
    if (stopFlag || low >= high) {
      if (low === high) sortedSet.add(low);
      return;
    }
    const pi = await partition(arr, low, high);
    sortedSet.add(pi);
    await qs(arr, low, pi - 1);
    await qs(arr, pi + 1, high);
  }

  await qs(arr, 0, arr.length - 1);
  if (!stopFlag) {
    const colors = {};
    arr.forEach((_, i) => colors[i] = 'var(--bar-sorted)');
    renderBars(arr, colors);
    statusBar.textContent = `✓ Done! ${comparisons} comparisons, ${swaps} swaps`;
  }
  array = arr;
}

// ====== RUN SORT ======
async function runSort() {
  if (sorting) return;
  sorting = true;
  stopFlag = false;
  comparisons = 0; swaps = 0;
  startTime = performance.now();
  document.getElementById('btnSort').disabled = true;

  const fns = { selection: selectionSort, bubble: bubbleSort, merge: mergeSort, heap: heapSort, quick: quickSort };
  await fns[currentAlgo]();

  sorting = false;
  document.getElementById('btnSort').disabled = false;
  updateStats();
}

// ====== INFO PANEL ======
function renderInfo(algo) {
  const info = ALGO_INFO[algo];
  infoPanel.innerHTML = `
    <div class="info-card">
      <h3>Description</h3>
      <p class="desc-text">${info.desc}</p>
      <div style="margin-top:12px">
        <span class="tag ${info.stable ? 'tag-stable' : 'tag-unstable'}">${info.stable ? '✓ Stable' : '✗ Unstable'}</span>
        <span class="tag ${info.inplace ? 'tag-inplace' : 'tag-notinplace'}">${info.inplace ? '✓ In-Place' : '✗ Extra Space'}</span>
      </div>
    </div>
    <div class="info-card">
      <h3>Complexity</h3>
      <table class="complexity-table">
        <tr><td>Best Case</td><td class="good">${info.time_best}</td></tr>
        <tr><td>Average</td><td class="ok">${info.time_avg}</td></tr>
        <tr><td>Worst Case</td><td class="bad">${info.time_worst}</td></tr>
        <tr><td>Space</td><td class="${info.space === 'O(1)' ? 'good' : 'ok'}">${info.space}</td></tr>
      </table>
    </div>
    <div class="info-card">
      <h3>Pseudocode</h3>
      <div class="pseudo-code">${info.pseudo}</div>
    </div>
  `;
}

function switchAlgo(algo) {
  if (sorting) { stopFlag = true; }
  currentAlgo = algo;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.algo === algo));
  const info = ALGO_INFO[algo];
  algoTitle.innerHTML = `${info.name} <span>${info.badge}</span>`;
  renderInfo(algo);
  generateArray();
}

// ====== EVENT LISTENERS ======
document.getElementById('algTabs').addEventListener('click', e => {
  if (e.target.classList.contains('tab-btn')) switchAlgo(e.target.dataset.algo);
});

document.getElementById('btnSort').addEventListener('click', runSort);
document.getElementById('btnGenerate').addEventListener('click', () => { if (!sorting) generateArray(); });
document.getElementById('btnStop').addEventListener('click', () => { stopFlag = true; sorting = false; document.getElementById('btnSort').disabled = false; statusBar.textContent = 'Stopped.'; });

sizeSlider.addEventListener('input', () => {
  sizeVal.textContent = sizeSlider.value;
  if (!sorting) generateArray();
});

speedSlider.addEventListener('input', () => {
  speedVal.textContent = SPEED_LABELS[speedSlider.value];
});

// ====== START ======
switchAlgo('selection');
</script>
